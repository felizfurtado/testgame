<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYSTICAL — Midnight Scandal</title>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
    --gold:#d7b56d;
    --cream:#f4eee2;
    --muted:#b8afa1;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:var(--cream);
    font-family:Georgia,"Times New Roman",serif;
}

button{font:inherit}

.game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    isolation:isolate;
}

/* =========================
   SCENE
========================= */

.scene{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#000;
}

.scene img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    opacity:0;
    transform:none;
    transition:opacity .48s ease-in-out;
    z-index:1;
    filter:brightness(.92) contrast(1.04) saturate(.88);
    user-select:none;
    -webkit-user-drag:none;
}

.scene img.active{
    opacity:1;
}


/* Crossfade dark layer */
.scene::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            ellipse at center,
            transparent 28%,
            rgba(0,0,0,.12) 58%,
            rgba(0,0,0,.78) 100%
        );
    pointer-events:none;
}

/* =========================
   FILM EFFECTS
========================= */

.vignette{
    position:absolute;
    inset:0;
    z-index:8;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 34%,
            rgba(0,0,0,.12) 55%,
            rgba(0,0,0,.76) 100%
        );
}

.grain{
    position:absolute;
    inset:-50%;
    z-index:30;
    pointer-events:none;
    opacity:.045;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
    animation:grain .22s steps(2) infinite;
}

@keyframes grain{
    0%{transform:translate(0,0)}
    25%{transform:translate(1.5%,-1%)}
    50%{transform:translate(-1%,1.5%)}
    75%{transform:translate(1%,1%)}
    100%{transform:translate(-1.5%,-1.5%)}
}

.letterbox{
    position:absolute;
    left:0;
    right:0;
    height:6vh;
    background:#000;
    z-index:25;
    pointer-events:none;
}
.letterbox.top{top:0}
.letterbox.bottom{bottom:0}

/* =========================
   FLICKER
========================= */

.scene.flicker img.active{
    animation:flicker .18s infinite;
}

@keyframes flicker{
    0%,100%{filter:brightness(.92) contrast(1.04)}
    13%{filter:brightness(.60) contrast(1.1)}
    27%{filter:brightness(1.02) contrast(1.04)}
    43%{filter:brightness(.32) contrast(1.15)}
    57%{filter:brightness(.80) contrast(1.08)}
    73%{filter:brightness(.42) contrast(1.15)}
}

/* =========================
   BLACKOUT
========================= */

.blackout{
    position:absolute;
    inset:0;
    z-index:50;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity .65s ease;
}

.blackout.on{
    opacity:1;
    transition:opacity .28s ease;
}

/* brief flash */
.flash{
    position:absolute;
    inset:0;
    z-index:60;
    background:#eee8d9;
    opacity:0;
    pointer-events:none;
}

.flash.on{
    animation:flash .32s ease;
}

@keyframes flash{
    0%{opacity:0}
    15%{opacity:.16}
    32%{opacity:.75}
    50%{opacity:.18}
    100%{opacity:0}
}

/* =========================
   SHAKE
========================= */

.shake{
    animation:shake .75s cubic-bezier(.36,.07,.19,.97);
}

@keyframes shake{
    0%,100%{transform:translate3d(0,0,0)}
    10%{transform:translate3d(-7px,4px,0)}
    20%{transform:translate3d(8px,-4px,0)}
    30%{transform:translate3d(-9px,3px,0)}
    42%{transform:translate3d(7px,-3px,0)}
    54%{transform:translate3d(-5px,2px,0)}
    68%{transform:translate3d(3px,-1px,0)}
}

/* =========================
   COMIC BOOK STORY TEXT
========================= */

.story{
    position:absolute;
    left:50%;
    bottom:10%;
    transform:translateX(-50%) translateY(12px);
    width:min(920px,88%);
    z-index:70;
    text-align:center;
    opacity:0;
    transition:opacity .45s ease, transform .45s ease;
    pointer-events:none;
    
}


.story.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.story p{
    display:inline-block;
    position:relative;
    max-width:900px;
    padding:18px 30px 20px;
    font-family:'Comic Neue', sans-serif !important;
    font-size:clamp(20px,2.25vw,31px);
    font-weight:700;
    line-height:1.35;
    letter-spacing:.15px;
    color:#17130e;
    background:#f5edda;
    border:3px solid #17130e;
    border-radius:7px;
    box-shadow:
        6px 7px 0 rgba(0,0,0,.75),
        0 10px 35px rgba(0,0,0,.45);
    text-shadow:none;
}

/* Comic speech bubble tail */
.story p::after{
    content:"";
    position:absolute;
    bottom:-18px;
    left:20%;
    width:28px;
    height:28px;
    background:#f5edda;
    border-right:3px solid #17130e;
    border-bottom:3px solid #17130e;
    transform:rotate(45deg);
    z-index:-1;
}

/* All story text uses the same comic-book bubble */
.story .whisper{
    display:inline;
    color:#17130e;
    background:transparent;
    border:0;
    padding:0;
    font-size:.78em;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    border-radius:0;
    box-shadow:none;
}

/* Comic accent */
.story::after{
    content:"";
    display:block;
    width:46px;
    height:4px;
    background:var(--gold);
    border:1px solid #17130e;
    opacity:.9;
    margin:18px auto 0;
    transform:skewX(-20deg);
}

/* Slight comic-book entrance */
@keyframes comicTextIn{
    0%{
        opacity:0;
        transform:translateY(12px) scale(.96) rotate(-1deg);
    }
    70%{
        transform:translateY(-2px) scale(1.015) rotate(.2deg);
    }
    100%{
        opacity:1;
        transform:translateY(0) scale(1) rotate(0);
    }
}

@keyframes linePulse{
    0%,100%{opacity:.15;transform:scaleX(.4)}
    50%{opacity:.8;transform:scaleX(1)}
}

/* =========================
   CHAPTER TITLE
========================= */

.chapter-title{
    position:absolute;
    inset:0;
    z-index:45;
    display:grid;
    place-items:center;
    pointer-events:none;
    opacity:0;
    transform:scale(1);
    transition:opacity 1.8s ease;
}

.chapter-title.show{
    opacity:1;
    transform:scale(1);
}

.chapter-title small{
    display:block;
    color:var(--gold);
    letter-spacing:7px;
    font-size:12px;
    text-align:center;
    margin-bottom:18px;
}

.chapter-title h2{
    font-size:clamp(38px,6vw,78px);
    font-weight:400;
    letter-spacing:8px;
    text-align:center;
    text-shadow:0 6px 35px #000;
}

/* =========================
   SCENE LABEL
========================= */

.scene-label{
    position:absolute;
    top:9%;
    left:50%;
    transform:translateX(-50%);
    z-index:70;
    color:rgba(244,238,226,.6);
    font-size:10px;
    letter-spacing:4px;
    text-transform:uppercase;
    opacity:0;
    transition:opacity 1.2s ease;
}

.scene-label.show{
    opacity:1;
    transform:translateX(-50%);
}

/* =========================
   INVESTIGATION
========================= */

.investigate{
    position:absolute;
    left:50%;
    bottom:7%;
    transform:translateX(-50%);
    z-index:80;
    opacity:0;
    pointer-events:none;
    transition:opacity 1s ease;
}

.investigate.show{
    opacity:1;
    transform:translateX(-50%);
    pointer-events:auto;
}

.investigate button{
    padding:15px 30px;
    border:1px solid var(--gold);
    background:rgba(7,6,5,.82);
    color:var(--cream);
    cursor:pointer;
    letter-spacing:2px;
    backdrop-filter:blur(10px);
    box-shadow:0 10px 45px rgba(0,0,0,.55);
    transition:.35s ease;
}

.investigate button:hover{
    background:var(--gold);
    color:#090806;
    transform:translateY(-2px);
}

/* =========================
   START
========================= */

.start-screen{
    position:absolute;
    inset:0;
    z-index:100;
    display:grid;
    place-items:center;
    background:
        radial-gradient(circle at center,#292117 0%,#0b0907 45%,#000 100%);
    transition:opacity 1.5s ease;
}

.start-content{
    width:min(720px,90%);
    text-align:center;
}

.brand{
    color:var(--gold);
    font-size:12px;
    letter-spacing:9px;
    margin-bottom:18px;
}

.start-content h1{
    font-size:clamp(44px,7vw,88px);
    font-weight:400;
    letter-spacing:10px;
    text-shadow:0 8px 35px #000;
}

.start-content .chapter{
    margin-top:15px;
    color:#bcb4a7;
    letter-spacing:4px;
    font-size:13px;
}

.enter{
    margin-top:45px;
    padding:15px 36px;
    border:1px solid var(--gold);
    background:rgba(0,0,0,.35);
    color:var(--cream);
    cursor:pointer;
    letter-spacing:3px;
    transition:.4s ease;
}

.enter:hover{
    background:var(--gold);
    color:#080706;
    box-shadow:0 0 30px rgba(215,181,109,.25);
    transform:translateY(-2px);
}

/* =========================
   SKIP INTRO
========================= */

.skip-intro{
    position:absolute;
    right:25px;
    top:25px;
    z-index:95;
    display:none;
    padding:10px 18px;
    border:1px solid rgba(215,181,109,.65);
    background:rgba(0,0,0,.62);
    color:var(--cream);
    cursor:pointer;
    font-size:11px;
    letter-spacing:2px;
    backdrop-filter:blur(8px);
    transition:.3s ease;
}

.skip-intro:hover{
    background:var(--gold);
    color:#080706;
    transform:translateY(-1px);
}

/* =========================
   REPLAY
========================= */

.replay{
    position:absolute;
    right:25px;
    bottom:25px;
    z-index:90;
    display:none;
    padding:10px 18px;
    border:1px solid rgba(215,181,109,.65);
    background:rgba(0,0,0,.65);
    color:var(--cream);
    cursor:pointer;
    font-size:12px;
    letter-spacing:2px;
}

/* =========================
   LOADING
========================= */

.loading{
    position:absolute;
    inset:0;
    z-index:120;
    display:grid;
    place-items:center;
    background:#000;
    color:#aaa;
    letter-spacing:3px;
    font-size:11px;
    transition:opacity .7s;
}

.loading.hide{
    opacity:0;
    pointer-events:none;
}

@media(max-width:700px){
    .letterbox{height:4vh}
    .story{bottom:10%;width:90%}
    .story p{font-size:17px}
}
</style>
</head>

<body>

<div class="game" id="game">

    <div class="loading" id="loading">PREPARING THE NIGHT...</div>

    <div class="scene" id="scene">
        <img id="sceneImageA" src="01_ballroom.png" class="active" alt="">
        <img id="sceneImageB" src="01_ballroom.png" alt="">
    </div>

    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>

    <div class="scene-label" id="sceneLabel">
        THE DUKE'S BALLROOM · 11:58 PM
    </div>

    <div class="chapter-title" id="chapterTitle">
        <div>
            <small>CHAPTER ONE</small>
            <h2>THE SCANDAL</h2>
        </div>
    </div>

    <div class="story" id="story">
        <p id="storyText"></p>
    </div>

    <div class="blackout" id="blackout"></div>
    <div class="flash" id="flash"></div>

    <div class="investigate" id="investigate">
        <button onclick="startInvestigation()">INVESTIGATE THE SCENE</button>
    </div>

    <button class="skip-intro" id="skipIntro" onclick="skipIntro()">SKIP INTRO</button>
    <button class="replay" id="replay" onclick="location.reload()">REPLAY</button>

    <div class="start-screen" id="startScreen">
        <div class="start-content">
            <div class="brand">MYSTICAL</div>
            <h1>MIDNIGHT SCANDAL</h1>
            <div class="chapter">CHAPTER ONE · THE SCANDAL</div>
            <button class="enter" onclick="startGame()">ENTER THE BALLROOM</button>
        </div>
    </div>

</div>

<script>
/* =========================================================
   IMAGE ASSETS
========================================================= */

const images = {
    ballroom: "01_ballroom.png",
    clock1159: "02_clock_1159.png",
    clock1200: "03_clock_1200.png",
    flicker: "04_chandelier_flicker.png",
    dark: "05_dark_ballroom.png",
    duke: "06_duke_dead.png",
    seal: "07_broken_seal.png",

    // Chapter One additions
    study: "08_duke_study.png",
    studyDesk: "09_study_desk_investigation.png",
    diary: "10_dukes_diary.png",
    diaryOpen: "11_diary_open.png",
    diaryDiscovery: "12_diary_discovery.png",
    characters: "13_ballroom_characters.png",
    gossip: "14_gossip_tension.png",
    cliffhanger: "15_chapter1_cliffhanger.png"
};

/* =========================================================
   ELEMENTS
========================================================= */

const game = document.getElementById("game");
const scene = document.getElementById("scene");
const sceneImageA = document.getElementById("sceneImageA");
const sceneImageB = document.getElementById("sceneImageB");
const loading = document.getElementById("loading");
const startScreen = document.getElementById("startScreen");
const chapterTitle = document.getElementById("chapterTitle");
const story = document.getElementById("story");
const storyText = document.getElementById("storyText");
const blackout = document.getElementById("blackout");
const flash = document.getElementById("flash");
const sceneLabel = document.getElementById("sceneLabel");
const investigate = document.getElementById("investigate");
const replay = document.getElementById("replay");
const skipIntroButton = document.getElementById("skipIntro");

let introSkipped = false;
let introRunId = 0;

/* =========================================================
   AUDIO
========================================================= */

const audio = {
    music: new Audio("soundssuspense.mp3"),
    ambience: new Audio("sounds/suspense.mp3"),
    tick: new Audio("sounds/clock-tick-tock.wav"),
    bell: new Audio("sounds/bell.wav"),
    lights: new Audio("sounds/light_flicker.mp3"),
    scream: new Audio("sounds/scream.mp3"),
    thud: new Audio("sounds/thud.mp3"),
    heartbeat: new Audio("sounds/heartbeat.mp3"),
    clue: new Audio("sounds/clue_reveal.mp3"),
    dukeReveal: new Audio("sounds/darksong.mp3"),
};

audio.music.loop = true;
audio.ambience.loop = true;
audio.tick.loop = true;
audio.heartbeat.loop = true;
audio.dukeReveal.loop = true;

audio.music.volume = 1.0;
audio.ambience.volume = .20;
audio.tick.volume = .28;
audio.heartbeat.volume = .18;
audio.lights.volume = .35;
audio.scream.volume = .78;
audio.thud.volume = .68;
audio.bell.volume = .62;
audio.clue.volume = .5;
audio.dukeReveal.volume = .55;

/* =========================================================
   HELPERS
========================================================= */

function playSound(name){
    const sound = audio[name];
    if(!sound) return;

    try{
        sound.currentTime = 0;
        sound.play().catch(()=>{});
    }catch(e){}
}

function stopSound(name){
    const sound = audio[name];
    if(!sound) return;

    sound.pause();
    try{sound.currentTime = 0;}catch(e){}
}

function wait(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}

function showText(text, duration){
    clearTimeout(showText.timer);

    storyText.innerHTML = text;
    story.classList.remove("show");

    /* Give the old text time to disappear */
    setTimeout(()=>{
        story.classList.add("show");
    }, 180);

    showText.timer = setTimeout(()=>{
        story.classList.remove("show");
    }, duration);
}

/* Slow cinematic image transition */
async function changeScene(src, label){
    // Smooth, quick cinematic crossfade: old image fades out
    // while the new image fades in. No zoom or scaling.
    const current = document.querySelector(".scene img.active");
    const next = current === sceneImageA ? sceneImageB : sceneImageA;

    next.src = src;
    next.classList.add("active");
    current.classList.remove("active");

    await new Promise(resolve=>{
        if(next.complete) resolve();
        else next.onload = resolve;
    });

    sceneLabel.textContent = label;
    sceneLabel.classList.remove("show");
    requestAnimationFrame(() => {
        sceneLabel.classList.add("show");
    });

    await wait(650);
}

/* =========================================================
   PRELOAD
========================================================= */

async function preloadImages(){

    await Promise.all(
        Object.values(images).map(src =>
            new Promise(resolve=>{
                const img = new Image();
                img.onload = resolve;
                img.onerror = resolve;
                img.src = src;
            })
        )
    );

    loading.classList.add("hide");
}

/* =========================================================
   START
========================================================= */

async function fadeOutSound(name, duration = 1500) {
    const sound = audio[name];
    if (!sound) return;

    const startVolume = sound.volume;
    const steps = 30;
    const stepTime = duration / steps;

    for (let i = 0; i < steps; i++) {
        sound.volume = startVolume * (1 - (i + 1) / steps);
        await wait(stepTime);
    }

    sound.pause();
    sound.currentTime = 0;
    sound.volume = startVolume;
}

function skipIntro(){
    if (introSkipped) return;

    introSkipped = true;
    introRunId++;

    // Stop the opening cinematic audio.
    stopSound("tick");
    stopSound("ambience");
    stopSound("bell");
    stopSound("lights");

    // Reset visual effects from the opening sequence.
    blackout.classList.remove("on");
    flash.classList.remove("on");
    scene.classList.remove("flicker");
    game.classList.remove("shake");
    chapterTitle.classList.remove("show");
    story.classList.remove("show");

    // Jump directly to the ballroom before the countdown.
    const current = document.querySelector(".scene img.active");
    const next = current === sceneImageA ? sceneImageB : sceneImageA;
    next.src = images.ballroom;
    next.classList.add("active");
    current.classList.remove("active");

    sceneLabel.textContent = "THE DUKE'S BALLROOM · 11:58 PM";
    sceneLabel.classList.add("show");

    showText(
        "The ball is already underway. You arrive just before midnight.",
        3600
    );

    // Keep the skip control hidden after skipping.
    skipIntroButton.style.display = "none";

    // Resume from the character/social section rather than replaying the opening.
    setTimeout(async () => {
        if (!introSkipped) return;

        showText(
            "Among the guests were Prince Alden Marrow, Princess Ellara Marrow, Lady Evelyn Rosmere, and Miss Mabel Quill.",
            5200
        );

        await wait(5800);

        showText(
            "Your attention lingers on the Prince.",
            3600
        );

        await wait(4200);

        showText(
            "<span class='whisper'>But beneath the music, something feels wrong.</span>",
            3200
        );

        await wait(3800);

        await changeScene(
            images.gossip,
            "THE BALLROOM · WHISPERS"
        );

        showText(
            "Quiet conversations ripple through the room. Names are whispered. Secrets are traded.",
            4700
        );

        await wait(5300);

        showText(
            "Lady Evelyn watches the Prince. Mabel speaks hurriedly to another guest. The Duke seems unusually tense.",
            5000
        );

        await wait(5600);

        showText(
            "<span class='whisper'>Everyone has something to hide.</span>",
            3300
        );

        await wait(3900);

        continueToCountdown();
    }, 3800);
}

async function continueToCountdown(){
    if (!introSkipped) return;

    /* =====================================================
       11:59
    ===================================================== */

    await changeScene(
        images.clock1159,
        "THE CLOCK · 11:59 PM"
    );

    playSound("tick");

    showText(
        "11:59 PM.",
        2500
    );

    await wait(3200);

    showText(
        "<span class='whisper'>One minute until midnight.</span>",
        3200
    );

    await wait(4000);

    /* =====================================================
       MIDNIGHT
    ===================================================== */

    stopSound("tick");

    await changeScene(
        images.clock1200,
        "MIDNIGHT"
    );

    playSound("bell");

    showText(
        "<span class='whisper'>MIDNIGHT.</span>",
        3000
    );

    await wait(3900);

    /* =====================================================
       CHANDELIER
    ===================================================== */

    await changeScene(
        images.flicker,
        "THE BALLROOM · MOMENTS LATER"
    );

    showText(
        "Then the lights flickered.",
        2600
    );

    for(let i = 0; i < 3; i++){
        scene.classList.add("flicker");
        playSound("lights");
        await wait(650);
        scene.classList.remove("flicker");

        if(i < 2){
            await wait(650);
        }
    }

    showText(
        "<span class='whisper'>And then...</span>",
        2000
    );

    await wait(2000);

    /* =====================================================
       BLACKOUT
    ===================================================== */

    await changeScene(
        images.dark,
        "BLACKOUT"
    );

    await wait(1100);

    blackout.classList.add("on");

    await wait(1100);

    playSound("scream");

    await wait(1200);

    flash.classList.add("on");

    await wait(350);

    flash.classList.remove("on");

    playSound("thud");
    playSound("heartbeat");

    game.classList.add("shake");

    showText(
        "<span class='whisper'>A scream cuts through the darkness.</span>",
        3600
    );

    await wait(3600);

    blackout.classList.remove("on");

    await wait(1200);
    playSound("dukeReveal");

    await changeScene(
        images.duke,
        "THE BALLROOM · 12:01 AM"
    );

    await wait(2200);

    showText(
        "No one spoke.",
        2500
    );

    await wait(3300);

    showText(
        "The Duke was dead.",
        4200
    );

    await wait(5000);

    showText(
        "Everyone claimed they had been in the ballroom.",
        3600
    );

async function startGame(){

    introSkipped = false;
    skipIntroButton.style.display = "block";

    startScreen.style.opacity = "0";

    playSound("music");
    playSound("ambience");

    await wait(1500);

    startScreen.style.display = "none";

    /* TITLE — slow and elegant */

    await wait(500);

    chapterTitle.classList.add("show");

    await wait(4000);

    chapterTitle.classList.remove("show");

    await wait(1800);

    /* BALLROOM */

    sceneLabel.textContent =
        "THE DUKE'S BALLROOM · 11:58 PM";

    sceneLabel.classList.add("show");

    showText(
        "It was supposed to be an ordinary night at the Duke's mansion.",
        4200
    );

    await wait(4800);

    showText(
        "Music filled the ballroom. Laughter echoed beneath the chandeliers.",
        4000
    );

    await wait(4700);

    );

        3600
    );

    await wait(4200);

    showText(
        "<span class='whisper'>But beneath the music, something feels wrong.</span>",
        3200
    );

    await wait(3800);

    /* =====================================================
       GOSSIP & TENSION
    ===================================================== */

    await changeScene(
        images.gossip,

    showText(

    showText(
        "<span class='whisper'>Everyone has something to hide.</span>",

    );

    await wait(3900);

        /* =====================================================
       11:59

    await changeScene(
        images.clock1159,

        "11:59 PM.",

    );

    showText(
        "<span class='whisper'>One minute until midnight.</span>",
        3200
    );

    await wait(4000);

    /* =====================================================
       MIDNIGHT
    ===================================================== */

    stopSound("tick");

    await changeScene(
        images.clock1200,
        "MIDNIGHT"
    );

    playSound("bell");

    showText(
        "<span class='whisper'>MIDNIGHT.</span>",
        3000
    );

    await wait(3900);

    /* =====================================================
       CHANDELIER
    ===================================================== */

    await changeScene(
        images.flicker,
        "THE BALLROOM · MOMENTS LATER"
    );

    showText(
        "Then the lights flickered.",
        2600
    );

    // Three separate, deliberate chandelier flickers.
    for(let i = 0; i < 3; i++){
        scene.classList.add("flicker");
        playSound("lights");
        await wait(650);
        scene.classList.remove("flicker");

        if(i < 2){
            await wait(650);
        }
    }

    showText(
        "<span class='whisper'>And then...</span>",
        2000
    );

    await wait(2000);

    /* =====================================================
       BLACKOUT
    ===================================================== */

    await changeScene(
        images.dark,
        "BLACKOUT"
    );

    await wait(1100);

    /* sudden blackout */
    blackout.classList.add("on");

    await wait(1100);

    playSound("scream");

    await wait(1200);

    flash.classList.add("on");

    await wait(350);

    flash.classList.remove("on");

    );

       DUKE REVEAL

    );

    );
